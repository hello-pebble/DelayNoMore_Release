plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.delaynomore'
version = '0.32.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

// 인코딩을 플랫폼 기본값에 맡기지 않는다. JDK 18(JEP 400)부터 javac 기본이 UTF-8이라 지금
// 툴체인(21)에서는 사실상 no-op이지만, 이 저장소의 소스는 한글 주석·문자열·테스트 메서드명이
// 잔뜩 든 UTF-8이라 기본값에 의존할 자리가 아니다 — 더 낮은 JDK나 다른 툴체인에서 소스 해석이
// 흔들리면 한글 리터럴이 .class에 깨진 채 박힌다(표시 문제가 아니라 산출물이 망가지는 문제).
tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
	// 테스트 JVM이 표준출력을 UTF-8로 내보내게 한다. Gradle은 워커의 기본 charset으로 그 바이트를
	// 해석하므로, 여기서 고정하지 않으면 플랫폼에 따라 해석이 갈린다(평가 리포트를 콘솔에 찍는
	// evalAgent가 이 경로를 그대로 탄다).
	//
	// systemProperty(단수)로 하나씩 넣는다 — systemProperties = [..] 처럼 <b>맵을 통째로 대입</b>하면
	// 여기서 넣은 인코딩 설정이 지워진다(evalAgent가 실제로 그랬다).
	systemProperty 'file.encoding', 'UTF-8'
	systemProperty 'stdout.encoding', 'UTF-8'
	systemProperty 'stderr.encoding', 'UTF-8'
}

repositories {
	mavenCentral()
}

dependencyManagement {
	imports {
		// Testcontainers 아티팩트 버전 정렬 — Boot 4.1.0 BOM이 관리하지 않아 명시 BOM으로 고정.
		mavenBom 'org.testcontainers:testcontainers-bom:1.20.4'
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	// LLM 전송 계층(v0.24.0) — OpenAI 호환 API 호출·SSE 파싱·tool_calls 추출을 직접 구현하지 않고
	// LangChain4j에 맡긴다. 스타터가 아니라 단품인 이유: 모델 빈이 하나뿐이고 OpenRouter 특수
	// 파라미터(reasoning off) 주입이 필요해 자동구성이 주는 게 없다. 내부 Jackson 2는 프로젝트의
	// Jackson 3(tools.jackson)과 패키지가 달라 충돌하지 않는다.
	implementation 'dev.langchain4j:langchain4j-open-ai:1.17.2'
	// Boot 4부터 RestClient 자동구성(RestClient.Builder 빈)이 별도 스타터로 분리됨
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
	// PostgreSQL 영속화(v0.12.0) — NamedParameterJdbcTemplate·Hikari·트랜잭션 매니저.
	// postgres 프로필에서만 DataSource가 구성되고, 기본 프로필은 인메모리 저장소로 동작한다.
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	runtimeOnly 'org.postgresql:postgresql'
	// Flyway 10+는 DB별 모듈이 분리됨 — flyway-database-postgresql이 없으면
	// 기동 시 "Unsupported Database: PostgreSQL"로 실패한다. 버전은 Boot BOM 관리.
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	// Boot 4부터 FlywayAutoConfiguration도 spring-boot-autoconfigure에서 분리돼 별도 스타터가
	// 필요하다(Jackson·RestClient와 같은 패턴) — 이게 없으면 flyway-core만으로는 마이그레이션이
	// 자동 실행되지 않는다(스프링이 Flyway 빈을 아예 만들지 않음).
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	// PostgreSQL 통합 테스트 — Docker가 있는 환경(CI)에서 실제 PG 컨테이너로 JDBC 구현을 검증.
	// Docker가 없으면 @Testcontainers(disabledWithoutDocker = true)로 건너뛴다.
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	// 'eval' 태그는 실제 모델을 부르고 토큰을 쓴다 — CI가 무심코 돌리지 않도록 여기서 제외하고,
	// 아래 evalAgent 태스크로만 명시적으로 실행한다. (제외는 스킵이 아니다 — 아래 스킵 집계에
	// 잡히지 않는다.)
	useJUnitPlatform {
		excludeTags 'eval'
	}
	testLogging {
		// 기본 로깅은 "ExceptionType at File:Line"만 찍고 메시지를 생략해 원인 파악이 어렵다 —
		// CI에서 실패 원인을 로그만으로 바로 진단할 수 있게 전체 스택트레이스를 남긴다.
		exceptionFormat = 'full'
		showStackTraces = true
		showCauses = true
	}

	// [스킵은 통과가 아니다] Gradle은 성공한 실행에서 집계를 찍지 않으므로, 스킵된 테스트는
	// "BUILD SUCCESSFUL" 뒤에 조용히 숨는다. 실제로 그렇게 숨었다: PostgreSQL IT 2건이
	// v0.25.0부터 8개 릴리스 동안 CI에서 실패하는 동안, Docker 없는 로컬에서는 같은 클래스들이
	// 스킵되어 "실패 0"으로 초록이었다(docs/QA_RESULT_v0.26.0-v0.32.0.md 3-1장).
	// 그래서 집계는 언제나 찍고, 강제는 선택으로 둔다.
	def skippedByClass = new java.util.concurrent.ConcurrentHashMap<String, Integer>()
	afterTest { desc, result ->
		if (result.resultType.name() == 'SKIPPED') {
			skippedByClass.merge(desc.className, 1, { a, b -> a + b })
		}
	}

	// -PrequireIntegrationTests → *IT 클래스가 하나라도 스킵되면 빌드를 깨뜨린다.
	// CI는 이 플래그를 켠다(.github/workflows/ci.yml): GitHub 호스티드 러너에는 Docker가 있어
	// IT가 돌아야 정상이고, 안 돌면 그건 통과가 아니라 게이트가 꺼진 것이다. 로컬(Docker 없음)은
	// 플래그를 켜지 않으므로 종전처럼 스킵하고 통과한다 — 설정 시점에 읽어 둔다(doLast에서
	// project를 만지지 않게).
	def requireIntegrationTests = project.hasProperty('requireIntegrationTests')

	doLast {
		int total = skippedByClass.values().sum() ?: 0
		if (total == 0) {
			logger.lifecycle('[테스트] 스킵 0건 — 모든 테스트가 실제로 실행됐습니다.')
			return
		}
		logger.lifecycle("[테스트] 스킵 ${total}건 — 스킵은 통과가 아닙니다:")
		skippedByClass.sort().each { fqn, count ->
			logger.lifecycle("          ${fqn.tokenize('.').last()} (${count}건)")
		}
		def skippedIT = skippedByClass.keySet()
				.collect { it.tokenize('.').last() }
				.findAll { it.endsWith('IT') }
				.sort()
		if (skippedIT) {
			logger.lifecycle('          └ *IT 은 PostgreSQL(Testcontainers)이 필요합니다 — Docker 데몬이 없으면 스킵됩니다.')
			if (requireIntegrationTests) {
				throw new GradleException("통합 테스트 ${skippedIT.size()}개 클래스가 스킵됐습니다 "
						+ '(-PrequireIntegrationTests). Docker 데몬이 필요합니다: ' + skippedIT.join(', '))
			}
		}
	}
}

// 에이전트 도구 선택 평가 — 실제 모델 호출이 필요하다(OPENROUTER_API_KEY 미설정 시 자동 스킵).
//   ./gradlew evalAgent
//   ./gradlew evalAgent -Deval.repeats=3        케이스당 3회(모델 흔들림 측정)
//   ./gradlew evalAgent -Deval.minPassRate=80   통과율 합격선(기본 없음 — 권한 위반만 무조건 실패)
//   ./gradlew evalAgent -Deval.only=notool       케이스 id 접두사로 한 축만(쉼표로 여러 축)
//   ./gradlew evalAgent -Deval.threads=4        병렬 실행 — 시간의 99%가 응답 대기라 그대로 나뉜다
tasks.register('evalAgent', Test) {
	group = 'verification'
	description = '실제 모델로 에이전트 도구 선택 정확도를 측정하고 build/eval/report.md에 리포트를 남긴다.'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'eval'
	}
	// 평가 결과는 매번 달라질 수 있으므로 캐시된 "성공"을 재사용하면 안 된다.
	outputs.upToDateWhen { false }
	// -Deval.* 옵션을 테스트 JVM으로 전달한다(Gradle JVM의 시스템 프로퍼티는 자동 전파되지 않는다).
	// putAll로 <b>더한다</b> — `systemProperties = [..]`로 대입하면 위 withType(Test)가 넣어둔
	// 인코딩 설정까지 지워져 평가 리포트의 한글이 깨진다.
	systemProperties.putAll(System.properties.findAll { key, value -> key.toString().startsWith('eval.') })
	testLogging {
		showStandardStreams = true  // 리포트를 콘솔에서 바로 본다
		exceptionFormat = 'full'
		showStackTraces = true
		showCauses = true
	}
}
