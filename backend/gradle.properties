# Gradle 데몬 자체의 기본 인코딩. build.gradle의 JavaCompile/Test 설정이 소스 컴파일과 테스트
# JVM을 UTF-8로 고정하지만, 데몬이 다른 인코딩으로 돌면 테스트 출력을 콘솔로 되보내는 구간에서
# 다시 깨진다(테스트 JVM → Gradle 워커 → 데몬 → 콘솔의 각 단계가 같은 charset이어야 한다).
#
# 한국어 Windows는 플랫폼 기본이 CP949라 이 값이 없으면 파이프라인 중간에서 해석이 갈린다.
# Linux/macOS에서는 이미 UTF-8이라 no-op이다.
org.gradle.jvmargs=-Dfile.encoding=UTF-8
