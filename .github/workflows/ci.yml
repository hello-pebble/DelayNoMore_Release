name: CI

# PR과 main 푸시에서 프론트/백엔드가 깨지지 않았는지 검증하는 최소 게이트.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # -PrequireIntegrationTests: *IT(PostgreSQL·Testcontainers)이 하나라도 스킵되면 빌드를
      # 깨뜨린다. 호스티드 러너에는 Docker가 있어 IT가 도는 것이 정상이고, 안 돌면 그건 통과가
      # 아니라 게이트가 꺼진 것이다 — 그 상태로 8개 릴리스가 지나간 적이 있다
      # (docs/QA_RESULT_v0.26.0-v0.32.0.md 3-1장).
      - run: ./gradlew build --no-daemon -PrequireIntegrationTests
